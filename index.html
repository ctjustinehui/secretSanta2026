const fmt = iso => new Date(iso).toLocaleString("en-NZ", {day:"numeric", month:"short", hour:"numeric", minute:"2-digit"});
function msg(el, text, kind){ el.innerHTML=""; if(!text) return; const p=document.createElement("p"); p.className="msg "+kind; p.textContent=text; el.appendChild(p); }

// ---------- sealing: each person's match is encrypted with a key made from their own name ----------
const te = new TextEncoder(), td = new TextDecoder();
const hex = b => [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
const sha = s => crypto.subtle.digest("SHA-256", te.encode(s));
const lookupId = async (salt, alias) => hex(await sha("lookup|"+salt+"|"+alias));
const keyFor = async (salt, alias) => crypto.subtle.importKey("raw", await sha("key|"+salt+"|"+alias), "AES-GCM", false, ["encrypt","decrypt"]);
async function seal(pairs, example, adminPass){
  const salt = hex(crypto.getRandomValues(new Uint8Array(16)));
  // every way a person might type their name: full name, preferred name, UPI, email
  const aliasOwner = new Map(), clash = new Set();
  pairs.forEach((p,i) => p.giver.aliases.forEach(a => { if(aliasOwner.has(a) && aliasOwner.get(a)!==i) clash.add(a); else aliasOwner.set(a,i); }));
  const entries = {};
  for(const [alias,i] of aliasOwner){
    if(clash.has(alias)) continue;
    const {giver, recipient} = pairs[i];
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const body = te.encode(JSON.stringify({giver:giver.name, recipient:recipient.name, hints:recipient.hints}));
    const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, await keyFor(salt, alias), body);
    entries[await lookupId(salt, alias)] = {iv:b64(iv), ct:b64(ct)};
  }
  const counts = {student:0, staff:0}; pairs.forEach(p=>counts[p.giver.group]++);
  const aiv = crypto.getRandomValues(new Uint8Array(12));
  const list = te.encode(JSON.stringify(pairs.map(p=>[p.giver.name, p.recipient.name, p.giver.group])));
  const admin = {iv:b64(aiv), ct:b64(await crypto.subtle.encrypt({name:"AES-GCM", iv:aiv}, await adminKey(salt, adminPass), list))};
  return {v:1, at:new Date().toISOString(), salt, counts, example:!!example, entries, admin, clashes:[...clash]};
}
async function adminKey(salt, pass){
  const base = await crypto.subtle.importKey("raw", te.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:te.encode("admin|"+salt), iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function unsealAdmin(sealed, pass){
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(sealed.admin.iv)}, await adminKey(sealed.salt, pass), unb64(sealed.admin.ct));
  return JSON.parse(td.decode(pt));
}
async function unseal(sealed, typed){
  const alias = norm(typed); if(!alias) return null;
  const e = sealed.entries[await lookupId(sealed.salt, alias)]; if(!e) return null;
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(e.iv)}, await keyFor(sealed.salt, alias), unb64(e.ct));
  return JSON.parse(td.decode(pt));
}

// ---------- organiser ----------
const S = { people:[] };
(async () => {
  const user = window.claude ? await window.claude.use("user") : null;
  const isOrg = user ? ((await user.isOwner()) || (await user.canEdit())) : false;
  if(!isOrg) return;
  $("org").hidden=false;
  if(SEALED){
$("live-n").textContent = SEALED.counts.student + SEALED.counts.staff;
    $("live-title").textContent = SEALED.example ? "Test draw is live" : "Matches are live";
    $("live-detail").textContent = `${SEALED.counts.student} students · ${SEALED.counts.staff} staff · drawn ${fmt(SEALED.at)}`;
    $("draw").textContent = "Redraw"; $("share").hidden=false;
  }
})();

const lists={student:$("t-student"), staff:$("t-staff")};
function parse(){
  const people=[], warn=$("s1-warn"); warn.innerHTML="";
  const add=t=>{ const p=document.createElement("p"); p.className="msg warn"; p.textContent=t; warn.appendChild(p); };
  const seen=new Map(); let clash=false;
  for(const grp of ["student","staff"]){
    const names=lists[grp].value.split("\n").map(s=>s.trim().replace(/\s+/g," ")).filter(Boolean);
    const uniq=[...new Map(names.map(n=>[norm(n),n])).values()];
    if(uniq.length<names.length) add(`Some ${grp} names are listed twice. Each person is counted once.`);
    uniq.forEach(n=>{ if(seen.has(norm(n))){ clash=true; add(`"${n}" is in both lists. Remove them from one.`); } seen.set(norm(n),grp); people.push({name:n, group:grp, hints:""}); });
    $("c-"+grp).textContent=`${uniq.length} ${uniq.length===1?"person":"people"}`;
    if(uniq.length===1) add(`Only one ${grp==="staff"?"staff member":"student"}, so they can't be matched.`);
  }
  // lookup by full name, or by first name when nobody else shares it
  const firsts=new Map(); people.forEach(p=>{ const f=norm(p.name).split(" ")[0]; firsts.set(f,(firsts.get(f)||0)+1); });
  people.forEach(p=>{ const full=norm(p.name), f=full.split(" ")[0]; p.aliases=[full]; if(firsts.get(f)===1 && f!==full) p.aliases.push(f); });
  S.people=people;
  const ok=!clash && ["student","staff"].some(g=>people.filter(p=>p.group===g).length>=2);
  $("draw").disabled=!ok; $("s2").setAttribute("aria-disabled",String(!ok)); $("confirm").hidden=true;
  try{ localStorage.setItem("santa-lists", JSON.stringify({student:lists.student.value, staff:lists.staff.value})); }catch{}
}
try{ const d=JSON.parse(localStorage.getItem("santa-lists")||"null"); if(d){ lists.student.value=d.student||""; lists.staff.value=d.staff||""; } }catch{}
lists.student.oninput=lists.staff.oninput=parse;
const drop=$("drop"), file=$("file");
drop.onclick=()=>file.click();
drop.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); file.click(); } };
drop.ondragover=e=>{ e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave=()=>drop.classList.remove("over");
drop.ondrop=e=>{ e.preventDefault(); drop.classList.remove("over"); if(e.dataTransfer.files[0]) loadForms(e.dataTransfer.files[0]); };
file.onchange=()=>{ if(file.files[0]) loadForms(file.files[0]); file.value=""; };
const loadXlsx=()=>window.XLSX ? Promise.resolve() : new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload=ok; s.onerror=bad; document.head.appendChild(s); });
async function loadForms(f){
  const out=$("f-msg");
  try{
    await loadXlsx();
    const wb=XLSX.read(await f.arrayBuffer(), {type:"array"});
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:"", raw:false});
    const head=(aoa[0]||[]).map(h=>String(h).trim());
    const find=re=>head.findIndex(h=>re.test(h));
    const pref=find(/like.*used|preferred|go by|nickname/i);
    const full=head.findIndex((h,i)=>/name/i.test(h) && i!==pref);
    const grp=find(/group|student|staff/i), em=find(/e-?mail/i);
    if(full<0 && pref<0) return msg(out,"Couldn't find a name column in that file. Is it the Forms responses file?","err");
    if(grp<0) return msg(out,"Couldn't find the Student/Staff question in that file.","err");
    const latest=new Map(), unknown=[];
    for(const r of aoa.slice(1)){
      const name=String((pref>=0&&r[pref])||(full>=0?r[full]:"")).trim().replace(/\s+/g," "); if(!name) continue;
      const g=norm(r[grp]); const group=g.includes("staff")?"staff":g.includes("student")?"student":null;
      if(!group){ unknown.push(name); continue; }
      latest.set(em>=0&&r[em]?norm(r[em]):norm(name), {name, group}); // a resubmission replaces the earlier answer
    }
    const ppl=[...latest.values()];
    lists.student.value=ppl.filter(p=>p.group==="student").map(p=>p.name).join("\n");
    lists.staff.value=ppl.filter(p=>p.group==="staff").map(p=>p.name).join("\n");
    parse();
    msg(out, `Loaded ${ppl.length} people from ${f.name}. Check the lists below and fix any names by hand.`+(unknown.length?` Left out (no group chosen): ${unknown.join(", ")}.`:""), unknown.length?"warn":"ok");
  }catch{ msg(out,"Couldn't read that file. Save the responses as .xlsx or .csv and try again.","err"); }
}
parse();
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const r=new Uint32Array(1); crypto.getRandomValues(r); const j=r[0]%(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function drawPairs(people){
  const pairs=[];
  for(const grp of ["student","staff"]){
    const ps=shuffle(people.filter(p=>p.group===grp)); if(ps.length<2) continue;
    // one loop per group: each person gives to the next, so nobody draws themselves
    ps.forEach((p,i)=>pairs.push({giver:p, recipient:ps[(i+1)%ps.length]}));
  }
  return pairs;
}
function buildDoc(sealed){
  const reset=document.head.querySelector("style")?.textContent ||
    ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  const json=JSON.stringify(sealed).replace(/</g,"\\u003c");
  const end="</"+"script>";
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    + '<title>Secret Santa Draw</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+FONT_LINK+'\n'
    + '<style id="page-style">'+$("page-style").textContent+'</style>\n<div id="app"></div>\n'
    + '<script type="application/json" id="sealed">'+json+end+'\n'
    + '<script id="page-script">'+$("page-script").textContent+end+'</body></html>';
}
async function publishDraw(){
  const out=$("s3-msg"); $("draw").disabled=true; $("confirm").hidden=true;
  try{
    const pass=$("a-pass").value.trim();
    if(pass.length<4){ $("draw").disabled=false; return msg(out,"Set a checker password first (at least 4 characters).","err"); }
    const sealed=await seal(drawPairs(S.people), false, pass);
    const art=await claude.use("artifact");
    if(!art) throw {code:"unavailable"};
    msg(out,"Drawing…","ok");
    await art.publish(buildDoc(sealed)); // the page reloads into the new version
  }catch(err){
    $("draw").disabled=false;
    if(err?.code==="conflict") return;
    msg(out, err?.code==="not_writer"||err?.code==="not_granted" ? "This view can't save the page. Open it in claude.ai as the owner." : "Couldn't publish the draw. Try again in a moment.", "err");
  }
}
$("draw").onclick=()=>{ if(SEALED){ $("confirm").hidden=false; msg($("s3-msg"),"This replaces the current draw. Anyone who has already looked will get a new match.","warn"); } else publishDraw(); };
$("confirm").onclick=publishDraw;

// exposed for a self-test only
// "Check the draw" only appears when the address ends in #check

$("check-form").addEventListener("submit", async e=>{
  e.preventDefault(); const out=$("c-out"); out.innerHTML=""; msg($("c-msg"),"","");
  let rows=null; try{ rows=await unsealAdmin(SEALED, $("c-pass").value.trim()); }catch{}
  if(!rows) return msg($("c-msg"),"That password doesn't unlock the list.","err");
  const t=document.createElement("table"); t.innerHTML="<thead><tr><th>Santa</th><th>Buys for</th><th>Group</th></tr></thead>";
  const tb=document.createElement("tbody");
  rows.sort((a,b)=>a[2].localeCompare(b[2])||a[0].localeCompare(b[0])).forEach(([g,r,grp])=>{ const tr=document.createElement("tr");
    [[g],[r],[grp==="staff"?"Staff":"Student","g"]].forEach(([v,c])=>{ const td=document.createElement("td"); td.textContent=v; if(c) td.className=c; tr.appendChild(td); }); tb.appendChild(tr); });
  t.appendChild(tb); out.appendChild(t);
  const ok = rows.every(([g,r])=>g!==r) && new Set(rows.map(x=>x[1])).size===rows.length;
  const p=document.createElement("p"); p.className="msg "+(ok?"ok":"err"); p.style.marginTop="10px";
  p.textContent = ok ? `All ${rows.length} people give one gift and get one gift. Nobody has themselves.` : "Something's wrong with this draw. Redraw it.";
  out.appendChild(p);
  const hide=document.createElement("button"); hide.type="button"; hide.className="btn ghost"; hide.textContent="Hide list"; hide.style.marginTop="10px";
  hide.onclick=()=>{ out.innerHTML=""; $("c-pass").value=""; }; out.appendChild(hide);
});
$("dl").onclick = async ()=>{
  const out=$("dl-msg"); const dl = window.claude ? await window.claude.use("downloads") : null;
  if(!dl) return msg(out,"Downloads aren't available in this view. Open the page in claude.ai.","err");
  try{ await dl.save({filename:"Speech Group Secret Santa.html", data:buildDoc(SEALED)}); msg(out,"Saved. Attach this file to your email or Teams message.","ok"); }
  catch(e){ if(e?.code!=="declined") msg(out,"Couldn't save the file. Try again.","err"); }
};
window.__santa={seal, unseal, unsealAdmin, drawPairs, norm};
})();
